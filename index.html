<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AuraFit — Full-day Adaptive Wellness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/circletype@2.3.0/dist/circletype.min.js"></script>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="max-w-3xl mx-auto min-h-screen flex flex-col relative">

    <!-- SPLASH -->
    <div id="screen-splash" class="screen w-full h-screen flex flex-col items-center justify-center p-8">
      <div class="relative flex items-center justify-center w-48 h-48">
        <svg class="absolute w-full h-full animate-spin" style="animation-duration: 18s;" viewBox="0 0 100 100" aria-hidden>
          <path id="circle-path" fill="none" d="M 10, 50 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0"/>
          <text>
            <textPath xlink:href="#circle-path" class="fill-current text-teal-400 text-xs tracking-widest uppercase">AuraFit • Adaptive Wellness •</textPath>
          </text>
        </svg>
        <i data-lucide="sparkles" class="w-16 h-16 text-teal-400" aria-hidden></i>
      </div>
      <h1 class="text-4xl font-bold mt-6">AuraFit</h1>
      <p class="mt-2 muted">Personalized schedule from wake -> sleep</p>
      <div class="mt-8">
        <button id="btn-login" class="bg-teal-500 hover:bg-teal-600 px-6 py-3 rounded-full font-semibold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"></path></svg>
            <span>Login with Google</span>
        </button>
      </div>
    </div>

    <!-- ONBOARDING -->
    <div id="screen-onboarding" class="screen hidden w-full min-h-screen p-6 flex flex-col gap-6">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold">Set up your profile</h2>
        <div class="muted">Step 1 of 1</div>
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
          <label class="text-sm muted">Name</label>
          <input id="input-name" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700" placeholder="e.g. Anli" />
        </div>
        <div>
          <label class="text-sm muted">Wake time</label>
          <input id="input-wake" type="time" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700" value="06:30" />
        </div>
        <div>
          <label class="text-sm muted">Sleep time</label>
          <input id="input-sleep" type="time" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700" value="22:30" />
        </div>
        <div>
          <label class="text-sm muted">Primary Goal</label>
          <select id="input-goal" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700">
            <option value="loss">Lose weight</option>
            <option value="gain">Build muscle</option>
            <option value="stamina">Improve stamina</option>
            <option value="stress">Reduce stress</option>
          </select>
        </div>
        <div>
          <label class="text-sm muted">Equipment</label>
          <select id="input-equip" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700">
            <option value="none">No equipment</option>
            <option value="basic">Dumbbells / Bands</option>
            <option value="gym">Full gym</option>
          </select>
        </div>
        <div>
          <label class="text-sm muted">Diet</label>
          <select id="input-diet" class="w-full mt-2 p-3 rounded-lg bg-gray-900 border border-gray-700">
            <option value="any">Anything</option>
            <option value="veg">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="jain">Jain</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-3 mt-4">
        <button id="onboard-save" class="bg-teal-500 px-6 py-3 rounded-full font-semibold">Save & Continue</button>
        <button id="onboard-cancel" class="bg-gray-800 px-5 py-3 rounded-full">Cancel</button>
      </div>

      <div class="mt-4 muted text-sm">Your profile is saved locally on this device.</div>
    </div>

    <!-- MAIN APP -->
    <main id="screen-main" class="screen hidden w-full min-h-screen p-6 flex flex-col gap-6">
      <header class="flex items-center justify-between">
        <div>
          <p class="muted">Welcome back,</p>
          <h2 id="greet-name" class="text-2xl font-bold">Alex</h2>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-sm muted text-right">
            <div id="today-date"></div>
            <div id="wake-range" class="muted text-xs"></div>
          </div>
          <div id="avatar" class="w-12 h-12 rounded-full bg-teal-500 flex items-center justify-center font-bold">A</div>
          <button id="btn-logout" class="bg-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition hidden">Logout</button>
        </div>
      </header>

      <!-- Controls -->
      <section class="bg-gray-900 rounded-2xl p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="text-sm muted">Energy</label>
          <input id="energy" type="range" min="1" max="10" value="6" class="w-full mt-2" />
          <div class="text-sm muted mt-1"><span id="energy-label">6</span>/10</div>
        </div>
        <div>
          <label class="text-sm muted">Soreness</label>
          <input id="soreness" type="range" min="1" max="10" value="2" class="w-full mt-2" />
          <div class="text-sm muted mt-1"><span id="soreness-label">2</span>/10</div>
        </div>
        <div>
          <label class="text-sm muted">Available (min)</label>
          <input id="avail" type="range" min="10" max="120" step="5" value="30" class="w-full mt-2" />
          <div class="text-sm muted mt-1"><span id="avail-label">30</span> mins</div>
        </div>
      </section>

      <!-- Schedule timeline -->
      <section class="bg-gray-900 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-lg">Today's schedule</h3>
          <div class="flex items-center gap-2">
            <button id="btn-export-json" class="bg-gray-800 px-3 py-2 rounded">Export JSON</button>
            <button id="btn-export-csv" class="bg-gray-800 px-3 py-2 rounded">Export CSV</button>
          </div>
        </div>

        <div id="timeline" class="timeline space-y-6 pl-6">
          <!-- timeline entries inserted here -->
        </div>

      </section>

      <!-- Quick actions -->
      <section class="flex flex-wrap gap-3">
        <button id="btn-add-water" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Log water +250ml</button>
        <button id="btn-meditate" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Start breathing</button>
        <button id="btn-ai-generate" class="bg-green-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700 transition">Generate with AI</button>
        <button id="btn-reset" class="bg-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Reset to default</button>
      </section>

      <footer class="muted text-sm mt-4">Made with ♥ — AuraFit prototype. Use Export to save the plan.</footer>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="modal-overlay">
    <div id="modal-content" class="modal-content">
      <!-- Modal content is inserted here -->
    </div>
  </div>

  <!-- Loading Container -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="flex flex-col items-center">
        <div class="spinner"></div>
        <p class="text-gray-400 mt-4 text-center" id="loading-text">Generating your personalized schedule...</p>
    </div>
  </div>

  <script src="firebase.js" type="module"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
